<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#40c057"/>
    </linearGradient>
    <radialGradient id="bg" cx="30%" cy="25%" r="80%">
      <stop offset="0" stop-color="#16224a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="58" y="58" width="396" height="396" rx="98" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- 腕力图标：两手相握 -->
  <circle cx="180" cy="280" r="55" fill="none" stroke="url(#g)" stroke-width="14"/>
  <circle cx="332" cy="280" r="55" fill="none" stroke="url(#g)" stroke-width="14"/>
  <circle cx="180" cy="280" r="22" fill="rgba(255,255,255,0.7)"/>
  <circle cx="332" cy="280" r="22" fill="rgba(255,255,255,0.7)"/>
  <line x1="235" y1="280" x2="277" y2="280" stroke="rgba(255,255,255,0.92)" stroke-width="6" stroke-linecap="round"/>
  <!-- W 字母 -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="bold" fill="rgba(255,255,255,0.92)">W</text>
</svg>
